<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Project Decision</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    margin: 0;
    padding: 30px 20px;
    color: #333;
  }

  .container {
    max-width: 700px;
    margin: 0 auto;
    background-color: #fff;
    border: 1px solid #ccc;
    padding: 0;
  }

  .section {
    padding: 18px 24px;
    border-bottom: 1px solid #ccc;
  }

  .section:last-child {
    border-bottom: none;
  }

  .section-title {
    font-size: 13px;
    color: #555;
    margin: 0 0 6px 0;
    text-align: center;
  }

  .section-value {
    font-size: 15px;
    font-weight: bold;
    text-align: center;
    margin: 0;
  }

  .message-section {
    text-align: center;
    font-size: 13px;
    color: #333;
  }

  .message-section p {
    margin: 4px 0;
  }

  .question-section {
    font-size: 13px;
    color: #333;
  }

  .question-section p {
    margin: 0 0 10px 0;
    font-size: 13px;
  }

  .radio-group {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    margin-left: 20px;
  }

  .radio-group label {
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }

  .radio-group input[type="radio"] {
    margin: 0;
    cursor: pointer;
  }

  .button-section {
    text-align: right;
    padding: 14px 24px;
  }

  .ok-button {
    background-color: #cc3333;
    color: white;
    border: none;
    padding: 8px 28px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 2px;
  }

  .ok-button:hover {
    background-color: #aa2222;
  }

  .task-counter {
    text-align: right;
    font-size: 12px;
    color: #777;
    margin-bottom: 10px;
    max-width: 700px;
    margin-left: auto;
    margin-right: auto;
  }

  .condition-label {
    font-size: 12px;
    color: #666;
    text-align: center;
    margin-bottom: 14px;
  }
</style>
</head>
<body>

<div class="task-counter">Trial 1 of 1</div>

<div class="container">

  <!-- Quality Section -->
  <div class="section">
    <p class="section-title">The quality of your sender's project in this round is:</p>
    <p class="section-value">Bad</p>
  </div>

  <!-- Sender Message Section -->
  <div class="section message-section">
    <p>Your sender has sent you the following message:</p>
    <p><strong>I will reduce the profit if my project is blocked</strong></p>
  </div>

  <!-- Question Section -->
  <div class="section question-section">
    <p>Would you like to block the project?</p>
    <div class="radio-group">
      <label>
        <input type="radio" name="block" value="yes"> Yes
      </label>
      <label>
        <input type="radio" name="block" value="no"> No
      </label>
    </div>
  </div>

  <!-- Button Section -->
  <div class="button-section">
    <button class="ok-button">OK</button>
  </div>

</div>

</body>
</html>
